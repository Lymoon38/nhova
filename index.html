<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#07111f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png">
    <title>Nhova</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app" id="app" data-state="idle">

    <!-- Barre du haut : le bouton adulte demande un appui long (1,5 s) -->
    <header class="top">
        <div class="brand">Nhova</div>
        <button id="adultButton" class="adult-button" type="button"
                aria-label="Réglages pour l'accompagnant : maintenir appuyé">🔧</button>
    </header>

    <!-- Visage de Nhova : change selon ce qu'elle fait -->
    <section class="stage">
        <div id="face" class="face" aria-hidden="true">😊</div>
        <p id="statusText" class="status-text">Touche le gros bouton</p>
        <p id="caption" class="caption"></p>
    </section>

    <!-- Commandes : un énorme bouton + un bouton "répéter" -->
    <section class="controls">
        <button id="bigButton" class="big-button" type="button" aria-label="Parler à Nhova">
            <span id="bigIcon">🎤</span>
        </button>

        <div class="small-row">
            <button id="replayButton" class="replay-button" type="button" aria-label="Répéter">🔁</button>
            <button id="weatherButton" class="replay-button" type="button" aria-label="Météo">🌦️</button>
            <button id="outingsButton" class="replay-button" type="button" aria-label="Sorties">🗺️</button>
            <button id="gamesButton" class="replay-button" type="button" aria-label="Jeux">🎮</button>
        </div>
    </section>

    <!-- Jeux : puzzle et paires, tout se joue d'un seul appui -->
    <div id="gameOverlay" class="game-overlay">

        <div class="game-top">
            <button id="gameHome" class="round-btn" type="button" aria-label="Retour à Nhova">🏠</button>
            <button id="gameHint" class="round-btn" type="button" aria-label="Aide" hidden>💡</button>
        </div>

        <div id="gameMenu" class="game-menu">
            <button class="menu-card" data-game="puzzle" type="button" aria-label="Puzzle">🧩</button>
            <button class="menu-card" data-game="memory" type="button" aria-label="Jeu des paires">🃏</button>
            <button class="menu-card" data-game="bubbles" type="button" aria-label="Éclater les bulles">🎈</button>
            <button class="menu-card" data-game="piano" type="button" aria-label="Musique">🎹</button>
            <button class="menu-card" data-game="simon" type="button" aria-label="Répéter la suite">🧠</button>
            <button class="menu-card" data-game="listen" type="button" aria-label="Jeu d'écoute">👂</button>
            <button class="menu-card" data-game="odd" type="button" aria-label="Trouver le différent">🔍</button>
            <button class="menu-card" data-game="color" type="button" aria-label="Coloriage">🎨</button>
        </div>

        <div id="gameBoardWrap" class="board-wrap" hidden>
            <div id="gameBoard" class="board"></div>
        </div>

        <div id="gameBottom" class="game-bottom" hidden>
            <button id="gameMenuBtn" class="round-btn" type="button" aria-label="Choisir un autre jeu">🎮</button>
            <button id="gameNew" class="round-btn" type="button" aria-label="Nouvelle partie">🔄</button>
        </div>

        <div id="gameCelebrate" class="celebrate" hidden>🎉</div>
    </div>

    <!-- Météo : deux cartes (aujourd'hui, demain) + pictogrammes de conseils -->
    <div id="weatherOverlay" class="game-overlay">
        <div class="game-top">
            <button id="weatherHome" class="round-btn" type="button" aria-label="Retour à Nhova">🏠</button>
            <button id="weatherRepeat" class="round-btn" type="button" aria-label="Répéter">🔁</button>
        </div>
        <div id="weatherBody" class="weather-body"></div>
    </div>

    <!-- Sorties : chaque image ouvre Google Maps « près de moi » -->
    <div id="outingsOverlay" class="game-overlay">
        <div class="game-top">
            <button id="outingsHome" class="round-btn" type="button" aria-label="Retour à Nhova">🏠</button>
        </div>
        <div class="game-menu outings-menu">
            <button class="menu-card" data-out="musee" type="button" aria-label="Musée">🏛️</button>
            <button class="menu-card" data-out="restaurant" type="button" aria-label="Restaurant">🍽️</button>
            <button class="menu-card" data-out="cinema" type="button" aria-label="Cinéma">🎬</button>
            <button class="menu-card" data-out="rando" type="button" aria-label="Randonnée">🥾</button>
            <button class="menu-card" data-out="foire" type="button" aria-label="Foire ou fête foraine">🎡</button>
            <button class="menu-card" data-out="balade" type="button" aria-label="Balade dans un parc">🌳</button>
        </div>
    </div>

    <!-- Réglages pour l'accompagnant -->
    <div id="adultModal" class="modal">
        <div class="modal-content">
            <h2>🔧 Réglages (accompagnant)</h2>

            <div class="row"><span>Reconnaissance vocale</span><strong id="diagReco">—</strong></div>
            <div class="row"><span>Synthèse vocale</span><strong id="diagSpeech">—</strong></div>
            <div class="row"><span>Connexion sécurisée (HTTPS)</span><strong id="diagSecure">—</strong></div>

            <div class="row">
                <span>Vitesse de la voix</span>
                <div class="rate">
                    <button id="rateDown" class="opt-button" type="button">−</button>
                    <strong id="rateValue">0.9</strong>
                    <button id="rateUp" class="opt-button" type="button">+</button>
                </div>
            </div>

            <div class="row">
                <span>Voix de Nhova</span>
                <div class="rate">
                    <button id="voicePrev" class="opt-button" type="button" aria-label="Voix précédente">‹</button>
                    <strong id="voiceName" class="voice-name">Auto</strong>
                    <button id="voiceNext" class="opt-button" type="button" aria-label="Voix suivante">›</button>
                </div>
            </div>

            <div class="row">
                <span>Ville (utilisée si la localisation est refusée)</span>
                <input id="optCity" class="city-input" type="text" placeholder="Ville" autocomplete="off">
            </div>

            <div class="modal-actions">
                <button id="testVoice" class="opt-button wide" type="button">🔊 Tester la voix</button>
                <button id="closeAdult" class="opt-button wide primary" type="button">Fermer</button>
            </div>
        </div>
    </div>

</main>

<script src="script.js"></script>
<script src="games.js"></script>
</body>
</html>
